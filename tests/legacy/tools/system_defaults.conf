# DOSBox-X configuration: record the three "Modify -> System Defaults"
# screens of PRIMER.exe (Defaults, Criteria, Weights).
#
# Usage (from a scratch directory holding a c/ folder with PRIMER.exe
# and no pd2.cfg, so that the built-in defaults are shown):
#
#   SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy \
#       timeout -s KILL 42 dosbox-x -conf system_defaults.conf \
#       -nopromptfolder -fastlaunch
#   python3 -I zmbv.py cap/primer_000.avi frames/
#
# Keys (one every 2 s, after a 4 s wait): space dismisses the splash
# screen, right opens the Modify menu, seven downs reach System
# Defaults (the separator line counts as one step), then each
# sub-screen is opened with enter and closed with esc.

[sdl]
output=surface
[dosbox]
machine=svga_s3
captures=cap
[cpu]
cycles=max
[autoexec]
mount c c
c:
autotype -w 4 -p 2 space right down down down down down down down enter enter esc down enter esc down enter
dx-capture /V primer.exe
exit
