# DOSBox-X configuration: show the 256 characters of the VGA font.
# Used by make_vga_glyphs.sh (details there). DOSBox-X resolves the
# relative "mount c c" against the directory of this file.

[sdl]
output=surface
[dosbox]
machine=svga_s3
captures=cap
[cpu]
cycles=max
[autoexec]
mount c c
c:
cls
autotype -w 3 x
dx-capture /V glyphs.com
exit
