name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # weekly, so that a new compiler or runner image breaks CI rather
    # than a user's build
    - cron: '17 4 * * 1'

permissions:
  contents: read

# Linux jobs name their Ubuntu release (never ubuntu-latest): the
# current LTS and the previous one are supported

jobs:
  linux-gcc:
    name: ${{ matrix.os }}, GCC ${{ matrix.gcc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Qt 6.8 or later (for the graphical front-end) is packaged
        # from Ubuntu 26.04 on; on 24.04 (Qt 6.4) the GUI is not built
        include:
          - { os: ubuntu-24.04, gcc: 13, qt: '' }
          - { os: ubuntu-24.04, gcc: 14, qt: '' }
          - { os: ubuntu-26.04, gcc: 15, qt: qt6-base-dev }
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build g++-${{ matrix.gcc }} ${{ matrix.qt }}
      - name: Configure
        run: cmake --preset debug -DCMAKE_CXX_COMPILER=g++-${{ matrix.gcc }}
      - name: Build
        run: cmake --build --preset debug -j
      - name: Test
        run: ctest --preset debug

  linux-clang:
    name: ${{ matrix.os }}, clang ${{ matrix.clang }} and libc++
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, clang: 18 }
          - { os: ubuntu-26.04, clang: 20 }
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build clang-${{ matrix.clang }} \
            libc++-${{ matrix.clang }}-dev libc++abi-${{ matrix.clang }}-dev
      - name: Configure
        run: cmake --preset clang-debug -DCMAKE_CXX_COMPILER=clang++-${{ matrix.clang }}
      - name: Build
        run: cmake --build --preset clang-debug -j
      - name: Test
        run: ctest --preset clang-debug

  macos:
    name: macos-latest, Apple clang
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        # GNU coreutils for timeout(1), used by the CLI tests
        run: |
          brew install ninja coreutils
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Configure
        run: cmake --preset clang-debug -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build --preset clang-debug -j
      - name: Test
        run: ctest --preset clang-debug

  windows:
    name: windows-latest, MSYS2 UCRT64 GCC
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-tools
            zip
      - name: Configure
        run: cmake --preset release -DPRIMERPICKER_GUI=ON
      - name: Build
        id: build
        run: cmake --build --preset release -j
      - name: Test
        run: ctest --preset release
      - name: Keep the test log
        if: ${{ failure() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-ctest-log
          path: build/release/Testing/Temporary/LastTest.log
          retention-days: 14
      # the graphical program with its DLLs, to try out (releases come
      # from executables.yml), also when a test fails
      - name: Gather the graphical program and its DLLs
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          folder=primerpicker-gui-${GITHUB_SHA:0:7}-windows-x86_64
          sh packaging/windows/deploy-gui.sh build/release/src/gui/primerpicker-gui.exe "$folder"
          cp LICENSE README.md "$folder/"
          echo "GUI_FOLDER=$folder" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: ${{ env.GUI_FOLDER }}
          path: ${{ env.GUI_FOLDER }}
          retention-days: 14
          if-no-files-found: error

  clang-libstdcxx:
    # clang 20 with libstdc++, the configuration of clang-tidy, built and
    # tested (no other job tests it)
    name: ubuntu-26.04, clang 20 and libstdc++
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ninja-build clang-20 qt6-base-dev
      - name: Configure
        run: cmake --preset clang-libstdcxx
      - name: Build
        run: cmake --build --preset clang-libstdcxx -j
      - name: Test
        run: ctest --preset clang-libstdcxx

  clang-tidy:
    # the developers' tool version (clang-tidy 20). The files are split
    # into three shards, each checked on every core of its runner; no
    # build is needed, only the compile database and the files Qt
    # generates (moc)
    name: clang-tidy (clang 20, libstdc++), shard ${{ matrix.shard }} of 3
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ninja-build clang-20 clang-tidy-20 qt6-base-dev
      - name: Configure (clang-libstdcxx, the reference for clang-tidy)
        run: cmake --preset clang-libstdcxx
      - name: Generate the Qt files
        run: cmake --build --preset clang-libstdcxx --target primerpicker_gui_autogen
      - name: clang-tidy
        run: |
          find src tests/unit tests/gui -name '*.cpp' | sort | \
            awk -v shard=${{ matrix.shard }} 'NR % 3 == shard' | \
            xargs -P "$(nproc)" -n1 clang-tidy-20 -p build/clang-libstdcxx --quiet --warnings-as-errors='*'

  cppcheck:
    # the developers' tool version (cppcheck 2.19); older cppcheck
    # releases report false positives
    name: cppcheck
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cppcheck
      - name: cppcheck
        run: |
          cppcheck --force --enable=warning,style --language=c++ --std=c++20 \
            --error-exitcode=1 --quiet -Isrc src tests/unit tests/gui
