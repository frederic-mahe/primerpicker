name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # weekly, so that a new compiler or runner image breaks CI rather
    # than a user's build
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  linux-gcc:
    name: ${{ matrix.os }}, GCC ${{ matrix.gcc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, gcc: 13 }
          - { os: ubuntu-24.04, gcc: 14 }
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build g++-${{ matrix.gcc }}
      - name: Configure
        run: cmake --preset debug -DCMAKE_CXX_COMPILER=g++-${{ matrix.gcc }}
      - name: Build
        run: cmake --build --preset debug -j
      - name: Test
        run: ctest --preset debug

  linux-clang:
    name: ubuntu-24.04, clang ${{ matrix.clang }} and libc++
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        clang: [18]
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build clang-${{ matrix.clang }} \
            libc++-${{ matrix.clang }}-dev libc++abi-${{ matrix.clang }}-dev
      - name: Configure
        run: cmake --preset clang-debug -DCMAKE_CXX_COMPILER=clang++-${{ matrix.clang }}
      - name: Build
        run: cmake --build --preset clang-debug -j
      - name: Test
        run: ctest --preset clang-debug

  macos:
    name: macos-latest, Apple clang
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: brew install ninja
      - name: Configure
        run: cmake --preset clang-debug -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build --preset clang-debug -j
      - name: Test
        run: ctest --preset clang-debug

  windows:
    name: windows-latest, MSYS2 UCRT64 GCC
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release -j
      - name: Test
        run: ctest --preset release
